name: LMCache dev compatibility

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install current LMCache dev
        env:
          NO_GPU_EXT: "1"
        run: |
          python -m pip install \
            'lmcache @ git+https://github.com/LMCache/LMCache.git@dev'
          python -m pip install build pytest
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/lmcache_inprocess-*.whl
      - name: Run compatibility smoke tests
        run: |
          cd "${RUNNER_TEMP}"
          python -m pytest -q "${GITHUB_WORKSPACE}/tests/smoke"
          lmcache-inprocess-controller --help
          lmcache-inprocess-standalone --help
