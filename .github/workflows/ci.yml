name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LMCACHE_PINNED_REVISION: cf87a1ca70fcea192dc3820c745aae0b9253061b
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-wheel:
    name: Build and inspect wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_wheel_contents.py dist/lmcache_inprocess-*.whl
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lmcache-inprocess-dist
          path: dist/*
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.python }}, ${{ matrix.lmcache_ref }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        lmcache_ref:
          - cf87a1ca70fcea192dc3820c745aae0b9253061b
        include:
          - python: "3.12"
            lmcache_ref: dev
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install LMCache and test dependencies
        env:
          NO_GPU_EXT: "1"
        run: |
          python -m pip install \
            "lmcache @ git+https://github.com/LMCache/LMCache.git@${{ matrix.lmcache_ref }}"
          python -m pip install build pytest
      - name: Build and install this wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/lmcache_inprocess-*.whl
      - name: Run smoke tests from outside the checkout
        run: |
          cd "${RUNNER_TEMP}"
          python -m pytest -q "${GITHUB_WORKSPACE}/tests/smoke"
          lmcache-inprocess-controller --help
          lmcache-inprocess-standalone --help
      - name: Run focused CPU in-process tests
        if: matrix.python == '3.12' && matrix.lmcache_ref == env.LMCACHE_PINNED_REVISION
        run: |
          cd "${RUNNER_TEMP}"
          python -m pytest -q -m 'not cuda' \
            "${GITHUB_WORKSPACE}/tests/inprocess/v1/test_mock_gpu_connector.py" \
            "${GITHUB_WORKSPACE}/tests/inprocess/v1/test_config.py" \
            "${GITHUB_WORKSPACE}/tests/inprocess/v1/test_rpc_utils_socket_path.py" \
            "${GITHUB_WORKSPACE}/tests/inprocess/standalone/test_parse_kvcache_shape_spec.py" \
            "${GITHUB_WORKSPACE}/tests/inprocess/test_observability.py" \
            "${GITHUB_WORKSPACE}/tests/inprocess/usage_telemetry/test_usage_telemetry.py"

  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Run source checks
        run: |
          python -m pip install codespell==2.4.1 isort==6.0.1 pyyaml ruff==0.11.7
          ruff check lmcache/inprocess lmcache/integration/vllm/vllm_v1_adapter.py tests/smoke scripts
          ruff format --check lmcache/inprocess lmcache/integration/vllm/vllm_v1_adapter.py tests/smoke scripts
          isort --check-only lmcache/inprocess lmcache/integration/vllm/vllm_v1_adapter.py tests/smoke scripts
          codespell --toml pyproject.toml lmcache/inprocess lmcache/integration/vllm/vllm_v1_adapter.py tests/smoke scripts README.md
          bash scripts/validate_buildkite.sh
